<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudio interno de escena 3D</title><style>html,body{margin:0;background:#07101e;color:#f2e9d8;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}.copy{position:absolute;top:26vh;left:5vw;pointer-events:none;max-width:500px}h1{font-size:55px;line-height:1.04;letter-spacing:-.04em;font-weight:500}p{font-size:13px}#state{position:fixed;bottom:25px;left:5vw;font-size:11px}button{padding:12px;margin-right:8px}.controls{position:fixed;right:30px;bottom:25px}</style></head><body><canvas aria-hidden="true"></canvas><div class="copy"><p>GTA VI / VICE CITY</p><h1>La espera es real.<br>La próxima historia<br>es tuya.</h1><p>La ciudad cambia de luz. El viaje empieza aquí.</p></div><div id="state">Preparando materiales…</div><div class="controls"><button data-look="nocturne">Noche</button><button data-look="sunset">Última luz</button><button data-look="porcelain">Porcelana</button></div><script type="module">import{createWorld}from'../../assets/spatial/world.js';try{const world=await createWorld(document.querySelector('canvas'));window.world=world;document.querySelector('#state').textContent='Escena original · WebGL2 listo';document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>world.setVariant(b.dataset.look));document.addEventListener('pointermove',e=>world.setPointer((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2));window.onresize=world.resize;}catch(error){document.querySelector('#state').textContent=error.message;console.error(error);}</script></body></html>
